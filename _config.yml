# Research blurb shown on the homepage
research: >
  My lab envisions an inclusive future where people are empowered to collect,
  explore, and act on their personal data to make informed, personalized health decisions.
  We co-design, build, and deploy patient- and clinician-facing AI-powered health technologies
  in real-world care. We focus especially on people who have long been overlooked or underserved,
  with the goal of reducing health disparities. Our work has been recognized with 4 Best Paper Awards
  and 9 Honorable Mentions / Best Paper Nominations, and supported by NSF (CAREER, CRII, Medium) and NIH (R01).
  I was named an ACM Distinguished Member in 2025.

