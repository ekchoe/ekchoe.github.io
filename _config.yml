# Research blurb shown on the homepage
research: >
  I envision an inclusive future where everyone can access and use their personal data to make
  informed, personalized health decisions. I co-design, build, and evaluate AI-powered health
  technologies, both in the lab and in the wild. I work with people who have
  long been overlooked or underserved, including older adults, people with disabilities, and
  caregivers, to reduce health disparities through accessible design. My lab's work has received
  best paper awards at CHI, CSCW, and UbiComp. Our research has been supported by
  NSF (CAREER, CRII, Medium) and NIH (R01) among others.

